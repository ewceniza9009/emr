name: Halcyon Clinical OS CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend Pipeline (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore emr-server/emr-server.slnx
        
      - name: Build (Release)
        run: dotnet build emr-server/emr-server.slnx --configuration Release --no-restore
        
      - name: Run Unit Tests
        run: dotnet test emr-server/emr-server.slnx --configuration Release --no-build --verbosity normal

      - name: Clinical Security Scan
        run: |
          dotnet list emr-server/src/Api/Api.csproj package --vulnerable
          dotnet list emr-server/src/Api/Api.csproj package --deprecated

  frontend:
    name: Frontend Pipeline (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: emr-client/package-lock.json
          
      - name: Install dependencies
        run: cd emr-client && npm ci
        
      - name: Lint & Static Analysis
        run: cd emr-client && npm run lint
        
      - name: Production Build
        run: cd emr-client && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.halcyon.clinical
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          
  containerize:
    name: Container Security & Build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Local Images (Validation)
        run: |
          docker compose build
