services:
  postgres:
    image: postgres:15-alpine
    container_name: emr-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: emr-azurite
    hostname: azurite
    command: azurite --blobHost 0.0.0.0 --skipApiVersionCheck
    restart: always
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: emr-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cat/health | grep -qE 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  api:
    profiles:
      - full
    build:
      context: .
      dockerfile: emr-server/Dockerfile
    container_name: emr-api
    restart: always
    ports:
      - "34732:10000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true
      - ConnectionStrings__AzureStorage=${AZURE_STORAGE_CONNECTION_STRING}
      - Elasticsearch__Url=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - emr-network

volumes:
  postgres_data:
  azurite_data:
  es_data:

networks:
  emr-network:
    driver: bridge


