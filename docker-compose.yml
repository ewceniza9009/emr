services:
  postgres:
    image: postgres:15-alpine
    container_name: emr-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: emr-azurite
    hostname: azurite
    command: azurite --blobHost 0.0.0.0 --skipApiVersionCheck
    restart: always
    ports:
      - "10010:10000"
      - "10011:10001"
      - "10012:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: emr-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cat/health | grep -qE 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emr-network

  api:
    profiles:
      - full
    build:
      context: .
      dockerfile: emr-server/Dockerfile
    container_name: emr-api
    restart: always
    ports:
      - "34832:10000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true
      - ConnectionStrings__AzureStorage=${AZURE_STORAGE_CONNECTION_STRING}
      - Elasticsearch__Url=http://elasticsearch:9200
      - EMR_WIPE_DB=false
      - EMR_SEED_DB=false
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - emr-network

  client:
    profiles:
      - full
    build:
      context: ./emr-client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:34832
        - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:34832/graphql
        - NEXT_PUBLIC_GRAPHQL_WS_URL=ws://localhost:34832/graphql
        - NEXT_PUBLIC_SIGNALR_ENDPOINT=http://localhost:34832/hubs/telemetry
    container_name: emr-client
    restart: always
    ports:
      - "3681:3671"
    depends_on:
      api:
        condition: service_started
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - path: ./emr-client/.env.local
        required: false
    environment:
      - NEXTAUTH_URL=http://localhost:3681
    networks:
      - emr-network

  mobile:
    profiles:
      - full
    build:
      context: ./emr-mobile-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:34832
        - VITE_GRAPHQL_URL=http://localhost:34832/graphql
    container_name: emr-mobile-app
    restart: always
    ports:
      - "3682:3672"
    depends_on:
      api:
        condition: service_started
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - emr-network

volumes:
  postgres_data:
  azurite_data:
  es_data:

networks:
  emr-network:
    driver: bridge


